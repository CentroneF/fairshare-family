name: AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    environment: fairshare-family
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ai-cr:review'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Run advisory reviewer
        id: review
        uses: ./.github/actions/ai-reviewer
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ secrets.CODEX_MODEL }}

      - name: Publish advisory feedback
        uses: ./.github/actions/publish-ai-review
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          result: ${{ steps.review.outputs.result }}
          verdict: ${{ steps.review.outputs.verdict }}
          retry-requested: ${{ github.event.action == 'labeled' && github.event.label.name == 'ai-cr:review' }}
