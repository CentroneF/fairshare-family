name: AI Reviewer
description: Run the trusted local pull-request code reviewer

branding:
  icon: terminal
  color: purple

inputs:
  github-token:
    description: GitHub token used only to retrieve pull-request metadata and diff
    required: true
  pull-request-number:
    description: Pull request number to review
    required: true
  api-key:
    description: OpenAI API key used only by the reviewer process
    required: true
  model:
    description: Optional Codex model override
    required: false
    default: gpt-5.6-sol

outputs:
  result:
    description: Validated six-score review JSON
    value: ${{ steps.review.outputs.result }}
  verdict:
    description: Advisory pass/fail verdict from the validated review result
    value: ${{ steps.review.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Prepare review request
      id: request
      uses: actions/github-script@v7
      env:
        PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const pullNumber = Number(process.env.PULL_REQUEST_NUMBER);
          if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) throw new Error("Invalid pull request number");
          const { data: metadata } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pullNumber });
          const diff = await github.request("GET /repos/{owner}/{repo}/pulls/{pull_number}", {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pullNumber,
            mediaType: { format: "diff" },
          });
          const request = { title: metadata.title, diff: diff.data };
          if (metadata.body?.trim()) request.body = metadata.body;
          const requestFile = `${process.env.RUNNER_TEMP}/ai-review-request.json`;
          fs.writeFileSync(requestFile, JSON.stringify(request));
          core.setOutput("request-file", requestFile);
    - name: Install reviewer dependencies
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefix "$GITHUB_WORKSPACE/packages/code-reviewer"

    - name: Type-check reviewer
      shell: bash
      run: |
        set -euo pipefail
        npm run check --prefix "$GITHUB_WORKSPACE/packages/code-reviewer"

    - name: Run reviewer
      id: review
      shell: bash
      env:
        REQUEST_FILE: ${{ steps.request.outputs.request-file }}
        OPENAI_API_KEY: ${{ inputs.api-key }}
        CODEX_MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail

        reviewer_dir="$GITHUB_WORKSPACE/packages/code-reviewer"
        result_file="$RUNNER_TEMP/ai-review-result.json"

        test -f "$REQUEST_FILE"
        "$reviewer_dir/node_modules/.bin/tsx" "$reviewer_dir/src/cli.ts" --request "$REQUEST_FILE" > "$result_file"

        verdict="$(
          cd "$reviewer_dir"
          ./node_modules/.bin/tsx -e '
            import { readFile } from "node:fs/promises";
            import { reviewSchema } from "./src/schemas/review.ts";

            void (async () => {
              const resultFile = process.argv.at(-1);
              const result = reviewSchema.parse(JSON.parse(await readFile(resultFile, "utf8")));
              process.stdout.write(result.verdict);
            })();
          ' "$result_file"
        )"

        result="$(RESULT_FILE="$result_file" node -e 'const fs = require("fs"); process.stdout.write(JSON.stringify(JSON.parse(fs.readFileSync(process.env.RESULT_FILE, "utf8"))))')"
        printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
        printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
